name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [cmp-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          NUVIO_DEBUG_KEYSTORE_BASE64: ${{ secrets.NUVIO_DEBUG_KEYSTORE_BASE64 }}
          NUVIO_DEBUG_STORE_PASSWORD: ${{ secrets.NUVIO_DEBUG_STORE_PASSWORD }}
          NUVIO_DEBUG_KEY_ALIAS: ${{ secrets.NUVIO_DEBUG_KEY_ALIAS }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          # Fork: pinned debug keystore so consecutive cloud builds
          # update over each other instead of forcing reinstalls.
          if [ -n "$NUVIO_DEBUG_KEYSTORE_BASE64" ] && [ -n "$NUVIO_DEBUG_STORE_PASSWORD" ] && [ -n "$NUVIO_DEBUG_KEY_ALIAS" ]; then
            printf '%s' "$NUVIO_DEBUG_KEYSTORE_BASE64" | base64 --decode > androidApp/fork-debug.keystore
            {
              echo "NUVIO_DEBUG_STORE_FILE=androidApp/fork-debug.keystore"
              echo "NUVIO_DEBUG_STORE_PASSWORD=$NUVIO_DEBUG_STORE_PASSWORD"
              echo "NUVIO_DEBUG_KEY_ALIAS=$NUVIO_DEBUG_KEY_ALIAS"
            } >> local.properties
          fi

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
